<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Up'Appart : meubles, électroménager, vaisselle et déco de seconde main à Montpellier.">
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Up'Appart</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%233E5E49'/%3E%3Cg transform='translate(13 12) scale(.74)'%3E%3Cpath d='M18 46 L50 16 L82 46' fill='none' stroke='%23E9B949' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='31' y='48' width='38' height='22' rx='8' fill='%23F7F6EF'/%3E%3Crect x='27' y='62' width='46' height='15' rx='6' fill='%23F7F6EF'/%3E%3Crect x='20' y='55' width='14' height='24' rx='7' fill='%23F7F6EF'/%3E%3Crect x='66' y='55' width='14' height='24' rx='7' fill='%23F7F6EF'/%3E%3C/g%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Young+Serif&display=swap">
<style>
/* Layout : boutique seconde main, scène d'appartement interactive en ouverture, étiquettes de brocante comme signature */
:root{
  --bg:#ECEBE1; --surface:#F7F6EF; --raised:#FFFFFA; --ink:#22302A; --muted:#5C6A61; --line:#D3D2C3;
  --moss:#3E5E49; --on-moss:#F7F6EF; --sage:#86A487; --wood:#A9724A; --sun:#E9B949;
  --tag:#F3E6CC; --tag-ink:#3A2A1C; --shadow:rgba(34,48,42,.12);
  --wall:#E2E3D3; --floor:#C9A27A; --floor2:#BE9670; --counter:#7C8F7E;
  --t-meubles:#DCE3D3; --t-electro:#D7E1E2; --t-vaisselle:#E6DDD0; --t-deco:#E9E0C8;
  --ok:#3E7A4F; --warn:#A8662B;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161D19; --surface:#1E2722; --raised:#25302A; --ink:#E9E8DC; --muted:#A3AFA6; --line:#34423A;
  --moss:#A6C7A2; --on-moss:#14201A; --sage:#7E9C80; --wood:#D49B6E; --sun:#E9B949;
  --tag:#3B3226; --tag-ink:#F1E3C8; --shadow:rgba(0,0,0,.35);
  --wall:#26302A; --floor:#5C4632; --floor2:#54402E; --counter:#4E6152;
  --t-meubles:#26332B; --t-electro:#22313A; --t-vaisselle:#33302A; --t-deco:#35321F;
  --ok:#8FCB9B; --warn:#E3A86C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161D19; --surface:#1E2722; --raised:#25302A; --ink:#E9E8DC; --muted:#A3AFA6; --line:#34423A;
  --moss:#A6C7A2; --on-moss:#14201A; --sage:#7E9C80; --wood:#D49B6E; --sun:#E9B949;
  --tag:#3B3226; --tag-ink:#F1E3C8; --shadow:rgba(0,0,0,.35);
  --wall:#26302A; --floor:#5C4632; --floor2:#54402E; --counter:#4E6152;
  --t-meubles:#26332B; --t-electro:#22313A; --t-vaisselle:#33302A; --t-deco:#35321F;
  --ok:#8FCB9B; --warn:#E3A86C; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.12;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--moss);color:var(--on-moss)}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* bandeau + header */
.promo{background:var(--moss);color:var(--on-moss);font-size:13.5px;font-weight:500}
.promo .wrap{display:flex;gap:10px 28px;justify-content:center;flex-wrap:wrap;padding-block:8px;text-align:center}
@media (max-width:640px){.promo span:not(:first-child){display:none}.promo{font-size:12.5px}.scene-hint{font-size:12px;padding:4px 10px;left:10px;top:10px}.hot{width:28px;height:28px;font-size:15px}}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;gap:20px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-size:22px;white-space:nowrap}
.logo svg{width:34px;height:34px;flex:none}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{text-decoration:none;white-space:nowrap;padding:8px 12px;border-radius:999px;font-weight:500;font-size:15px}
nav.main a:hover{background:var(--bg)}
nav.main a[aria-current="page"]{background:var(--bg);color:var(--moss);font-weight:600}
.cart-btn{position:relative;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--surface);border:0;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer}
.cart-btn svg{width:18px;height:18px}
.cart-count{min-width:22px;height:22px;border-radius:11px;background:var(--sun);color:#22302A;font-size:12.5px;display:grid;place-items:center;padding:0 6px}
.menu-btn{display:none;background:none;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
@media (max-width:1080px){
  nav.main{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
  nav.main.open{display:flex}
  nav.main a{padding:12px 14px}
  .menu-btn{display:block;margin-left:auto}
  .cart-btn .lbl{display:none}
}

/* hero */
.hero{padding-block:44px 0}
.hero-top{display:grid;grid-template-columns:1.25fr 1fr;gap:28px 48px;align-items:end}
.hero h1{font-size:clamp(38px,6.2vw,74px);letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--moss);position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:.04em;height:.14em;background:var(--sun);opacity:.55;z-index:-1;border-radius:4px}
.hero-lead{font-size:18px;color:var(--muted);max-width:46ch}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.hero-facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{font-size:13.5px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:500}
@media (max-width:820px){.hero-top{grid-template-columns:1fr}}
.scene-box{position:relative;margin-top:34px;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:var(--wall);max-width:100%}
.scene-box svg.scene{display:block;width:100%;height:auto}
.scene-hint{position:absolute;left:16px;top:14px;background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600;box-shadow:0 4px 14px var(--shadow);display:flex;align-items:center;gap:8px}
.scene-hint i{width:9px;height:9px;border-radius:50%;background:var(--sun);display:block;animation:pulse 1.8s infinite}
.hot{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:0;background:var(--sun);color:#22302A;cursor:pointer;display:grid;place-items:center;font-weight:700;font-size:18px;box-shadow:0 0 0 4px rgba(233,185,73,.35)}
.hot::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--sun);animation:ring 2.2s infinite}
.hot .tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%) translateY(4px) rotate(-3deg);background:var(--tag);color:var(--tag-ink);font-family:var(--f-mono);font-size:12.5px;font-weight:500;white-space:nowrap;padding:7px 12px 7px 22px;border-radius:4px 10px 10px 4px;box-shadow:0 6px 16px var(--shadow);opacity:0;pointer-events:none;transition:.2s}
.hot .tip::before{content:"";position:absolute;left:8px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px var(--tag-ink)}
.hot:hover .tip,.hot:focus-visible .tip{opacity:1;transform:translateX(-50%) translateY(0) rotate(-3deg)}
@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes pulse{50%{opacity:.35}}
.sunrays{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.leaf{transform-box:fill-box;transform-origin:bottom center;animation:sway 5s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.rise.d2{animation-delay:.08s}.rise.d3{animation-delay:.16s}
@keyframes rise{from{transform:translateY(14px);opacity:.3}}

/* sections */
section.block{padding-block:72px 0}
.head-row{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.head-row h2{font-size:clamp(28px,3.6vw,42px)}
.link-more{font-weight:600;color:var(--moss);text-decoration:none;white-space:nowrap}
.link-more:hover{text-decoration:underline}
.promises{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.promise{display:flex;gap:14px;align-items:flex-start;padding:18px 0;border-top:2px solid var(--ink)}
.promise svg{width:38px;height:38px;flex:none;color:var(--moss)}
.promise b{display:block;font-size:17px}
.promise span{color:var(--muted);font-size:14.5px}
@media (max-width:760px){.promises{grid-template-columns:1fr}}

/* cartes produits */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:22px}
.card{display:flex;flex-direction:column;min-width:0}
.card-art{position:relative;display:block;aspect-ratio:5/4;border-radius:var(--r);background:var(--tint);overflow:hidden;color:var(--ink);max-width:100%}
.card-art svg.art{position:absolute;inset:12% 8% 4%;width:84%;height:84%;transition:transform .35s}
.card:hover .card-art svg.art{transform:scale(1.05) rotate(-1deg)}
.tag{position:absolute;top:14px;right:14px;background:var(--tag);color:var(--tag-ink);font-family:var(--f-mono);font-weight:500;font-size:14.5px;padding:6px 12px 6px 24px;border-radius:4px 10px 10px 4px;transform:rotate(4deg);box-shadow:0 3px 10px var(--shadow)}
.tag::before{content:"";position:absolute;left:9px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--tint,var(--bg));box-shadow:inset 0 0 0 1px var(--tag-ink)}
.badge-new,.badge-sold{position:absolute;left:12px;top:12px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.badge-new{background:var(--moss);color:var(--on-moss)}
.badge-sold{background:var(--ink);color:var(--surface)}
.card.is-sold .card-art svg{opacity:.4;filter:grayscale(1)}
.card-body{padding:12px 2px 0;display:flex;flex-direction:column;gap:4px;flex:1}
.card-meta{font-size:13px;color:var(--muted)}
.card h3{font-family:var(--f-body);font-weight:600;font-size:16.5px;line-height:1.3}
.card h3 a{text-decoration:none}
.card h3 a:hover{text-decoration:underline}
.dims{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px}
.state{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.state i{display:inline-flex;gap:3px}
.state i b{width:7px;height:7px;border-radius:50%;background:var(--line)}
.state i b.on{background:var(--ok)}
.btn-add{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn-add:hover{background:var(--ink);color:var(--surface)}
.btn-add.in{background:var(--moss);border-color:var(--moss);color:var(--on-moss)}

/* catégories */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.cat{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:220px;padding:18px;border-radius:var(--r);background:var(--tint);text-decoration:none;overflow:hidden;color:var(--ink)}
.cat h3{font-size:24px;position:relative;z-index:1}
.cat span{font-size:14px;color:var(--muted);position:relative;z-index:1}
.cat svg{position:absolute;right:-12px;bottom:-6px;width:70%;transition:transform .35s}
.cat:hover svg{transform:translateY(-6px) rotate(-3deg)}
@media (max-width:900px){.cats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){.cats{grid-template-columns:1fr}.cat{min-height:170px}}

/* étapes */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s}
.step{background:var(--surface);border-radius:var(--r);padding:22px;border:1px solid var(--line)}
.step .n{font-family:var(--f-display);font-size:42px;color:var(--wood);line-height:1}
.step h3{font-size:22px;margin:10px 0 6px}
.step p{color:var(--muted)}
@media (max-width:820px){.steps{grid-template-columns:1fr}}
.sell-band{margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 24px;border-radius:var(--r);background:var(--moss);color:var(--on-moss)}
.sell-band h3{font-size:24px}
.sell-band .btn{background:var(--on-moss);color:var(--moss)}

/* avis */
.reviews{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.review{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px}
.stars{color:var(--sun);letter-spacing:2px;font-size:17px}
.review footer{font-size:13.5px;color:var(--muted);margin-top:auto}
.note-demo{font-size:13px;color:var(--muted);font-style:italic}

/* boutique */
.page-head{padding-block:40px 24px}
.page-head h1{font-size:clamp(34px,5vw,56px)}
.page-head p{color:var(--muted);margin-top:8px;max-width:60ch}
.shop{display:grid;grid-template-columns:250px 1fr;gap:32px;align-items:start}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:22px}
.filters fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.filters legend{font-weight:700;margin-bottom:8px;font-size:14.5px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;font-weight:500}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
input[type=range]{width:100%;accent-color:var(--moss)}
.range-val{font-family:var(--f-mono);font-size:14px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.toolbar select{padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.count{color:var(--muted);font-size:14.5px}
.empty{padding:40px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.filters-toggle{display:none}
@media (max-width:860px){
  .shop{grid-template-columns:1fr}
  .filters{position:static;display:none;background:var(--surface);padding:16px;border-radius:var(--r);border:1px solid var(--line)}
  .filters.open{display:flex}
  .filters-toggle{display:inline-flex}
}

/* fiche produit */
.crumbs{font-size:14px;color:var(--muted);padding-top:26px}
.crumbs a{color:var(--muted)}
.product{display:grid;grid-template-columns:1.1fr 1fr;gap:44px;padding-top:18px;align-items:start}
.gallery-main{position:relative;aspect-ratio:1/1;border-radius:20px;background:var(--tint);overflow:hidden;color:var(--ink);max-width:100%}
.gallery-main svg.art{position:absolute;inset:10%;width:80%;height:80%;transition:transform .45s}
.gallery-main .tag{font-size:17px;top:20px;right:20px}
.thumbs{display:flex;gap:10px;margin-top:12px}
.thumb{width:76px;aspect-ratio:1;border-radius:12px;background:var(--tint);border:2px solid transparent;overflow:hidden;cursor:pointer;padding:0;position:relative;color:var(--ink)}
.thumb svg{position:absolute;inset:10%;width:80%;height:80%}
.thumb[aria-pressed="true"]{border-color:var(--ink)}
.view-1{transform:scaleX(-1)}
.view-2{transform:scale(1.9) translateY(4%)}
.p-info h1{font-size:clamp(30px,4vw,46px);margin:6px 0 12px}
.p-price{font-family:var(--f-mono);font-size:28px;font-weight:500}
.p-desc{color:var(--muted);margin-top:14px;max-width:56ch}
.spec{margin-top:20px;border-top:1px solid var(--line)}
.spec div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-family:var(--f-mono);font-size:14px;text-align:right}
.state-meter{display:flex;gap:6px;margin-top:4px}
.state-meter span{flex:1;font-size:12.5px;text-align:center;padding:6px 4px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.state-meter span.on{background:var(--moss);color:var(--on-moss);border-color:var(--moss);font-weight:600}
.guarantee{display:flex;gap:12px;align-items:center;margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--t-electro)}
.guarantee svg{width:30px;height:30px;flex:none;color:var(--moss)}
.p-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.p-actions .btn{flex:1;min-width:200px}
.impact{margin-top:16px;font-size:14.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.impact b{color:var(--ok)}
.p-delivery{margin-top:18px;display:grid;gap:8px;font-size:14.5px}
.p-delivery div{display:flex;gap:10px}
@media (max-width:860px){.product{grid-template-columns:1fr;gap:24px}}

/* formulaires */
.form{display:grid;gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-weight:600;font-size:14.5px}
.field small{color:var(--muted);font-size:13px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--raised)}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--moss);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--moss) 25%,transparent)}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-weight:500;font-size:14.5px;background:var(--raised)}
.radios label:has(input:checked){border-color:var(--moss);background:color-mix(in srgb,var(--moss) 12%,var(--raised))}
.radios input{accent-color:var(--moss)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;cursor:pointer;background:var(--raised);transition:.2s}
.drop.over{border-color:var(--moss);background:color-mix(in srgb,var(--moss) 10%,var(--raised))}
.previews{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.previews figure{margin:0;position:relative;width:86px;height:86px;border-radius:10px;overflow:hidden;background:var(--surface)}
.previews img{width:100%;height:100%;object-fit:cover}
.previews button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);cursor:pointer;font-size:13px;line-height:1}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.check input{margin-top:3px;accent-color:var(--moss)}
.err{color:var(--warn);font-size:13.5px;font-weight:500}
.sell-layout{display:grid;grid-template-columns:1fr 1.35fr;gap:40px;align-items:start}
.sell-aside{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.panel h3{font-size:22px;margin-bottom:12px}
.tl{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:30px 1fr;gap:10px}
.tl li b{width:30px;height:30px;border-radius:50%;background:var(--moss);color:var(--on-moss);display:grid;place-items:center;font-size:14px}
.tl li span{color:var(--muted);font-size:14.5px}
.tl li strong{display:block;color:var(--ink)}
.yesno{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:14.5px}
.yesno ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
@media (max-width:860px){.sell-layout{grid-template-columns:1fr}}
.success{text-align:center;padding:34px 22px}
.success svg{width:62px;height:62px;color:var(--ok)}
.success h3{font-size:28px;margin:10px 0 8px}
.success p{color:var(--muted);max-width:46ch;margin-inline:auto}

/* FAQ */
.faq-layout{display:grid;grid-template-columns:220px 1fr;gap:40px;align-items:start}
.faq-nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px);display:flex;flex-direction:column;gap:4px}
.faq-nav a{text-decoration:none;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:500}
.faq-nav a:hover{background:var(--surface);color:var(--ink)}
.faq-group{margin-bottom:34px;scroll-margin-top:110px}
.faq-group h2{font-size:28px;margin-bottom:12px}
details.qa{border-bottom:1px solid var(--line)}
details.qa summary{cursor:pointer;list-style:none;padding:16px 36px 16px 0;font-weight:600;font-size:16.5px;position:relative}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::after{content:"+";position:absolute;right:6px;top:12px;font-size:24px;font-weight:400;transition:transform .2s;color:var(--moss)}
details.qa[open] summary::after{transform:rotate(45deg)}
details.qa p{padding:0 0 18px;color:var(--muted);max-width:66ch}
@media (max-width:820px){.faq-layout{grid-template-columns:1fr}.faq-nav{position:static;flex-direction:row;flex-wrap:wrap}}

/* à propos */
.about{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
.about p{color:var(--muted);margin-top:14px;font-size:17px;max-width:56ch}
.about-art{border-radius:24px;overflow:hidden;background:var(--t-meubles);color:var(--ink);max-width:100%}
.about-art svg{display:block;width:100%;height:auto}
.values{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.value{padding:20px 0;border-top:2px solid var(--ink)}
.value h3{font-size:22px;margin-bottom:8px}
.value p{color:var(--muted)}
@media (max-width:820px){.about,.values{grid-template-columns:1fr}}

/* contact */
.contact{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:start}
.info-list{display:grid;gap:14px}
.info-list div{display:grid;grid-template-columns:110px 1fr;gap:12px;font-size:15px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.info-list dt{color:var(--muted)}
.info-list dd{margin:0;font-weight:500}
.map{margin-top:20px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.map svg{display:block;width:100%;height:auto}
.zone-check{display:flex;gap:8px;margin-top:10px}
.zone-check input{flex:1;min-width:0}
.zone-res{margin-top:8px;font-size:14.5px;font-weight:500;min-height:1.5em}
.zone-res.ok{color:var(--ok)}.zone-res.no{color:var(--warn)}
@media (max-width:860px){.contact{grid-template-columns:1fr}}

/* footer */
footer.site{margin-top:90px;background:var(--ink);color:var(--surface)}
footer.site .wrap{padding-block:56px 30px}
.foot-top{display:grid;grid-template-columns:1.2fr 1fr;gap:44px}
footer.site h2{font-size:30px}
footer.site p.muted{color:color-mix(in srgb,var(--surface) 70%,var(--ink));margin-top:8px}
.news{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.news input{flex:1;min-width:200px;padding:12px 16px;border-radius:999px;border:0;background:var(--surface);color:var(--ink)}
.news .btn{background:var(--sun);color:#22302A}
.news-msg{margin-top:10px;font-size:14px;min-height:1.4em;color:var(--sun)}
.insta-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.insta-head span{font-family:var(--f-mono);font-size:13.5px}
.insta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.insta a{position:relative;aspect-ratio:1;border-radius:10px;background:var(--tint);overflow:hidden;display:block;color:var(--ink);max-width:100%}
.insta a svg{position:absolute;inset:12%;width:76%;height:76%;transition:transform .3s}
.insta a:hover svg{transform:scale(1.1)}
.insta small{display:block;margin-top:8px;font-size:12.5px;color:color-mix(in srgb,var(--surface) 60%,var(--ink))}
.foot-links{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:44px;padding-top:22px;border-top:1px solid color-mix(in srgb,var(--surface) 20%,var(--ink));font-size:14px}
.foot-links a{text-decoration:none;color:color-mix(in srgb,var(--surface) 80%,var(--ink))}
.foot-links a:hover{color:var(--surface)}
.demo-note{margin-top:14px;font-size:12.5px;color:color-mix(in srgb,var(--surface) 55%,var(--ink))}
@media (max-width:820px){.foot-top{grid-template-columns:1fr}}

/* panier */
.overlay{position:fixed;inset:0;background:rgba(10,16,12,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:90;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-10px 0 40px var(--shadow)}
.drawer.open{transform:none}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dr-head h2{font-size:24px}
.x{background:none;border:0;font-size:26px;cursor:pointer;width:40px;height:40px;border-radius:50%;line-height:1}
.x:hover{background:var(--bg)}
.dr-steps{display:flex;gap:6px;padding:12px 20px 0}
.dr-steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.dr-steps span.on{background:var(--moss)}
.dr-body{flex:1;overflow-y:auto;padding:16px 20px}
.dr-foot{padding:16px 20px;border-top:1px solid var(--line);display:grid;gap:10px}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line .mini{width:64px;height:64px;border-radius:10px;background:var(--tint);position:relative;color:var(--ink)}
.line .mini svg{position:absolute;inset:8%;width:84%;height:84%}
.line b{display:block;font-weight:600;font-size:14.5px;line-height:1.3}
.line small{color:var(--muted);font-size:12.5px}
.line .pr{font-family:var(--f-mono);font-size:14.5px;text-align:right}
.line button{background:none;border:0;color:var(--muted);font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0;margin-top:2px}
.tot{display:flex;justify-content:space-between;font-size:15px}
.tot.big{font-size:18px;font-weight:700}
.tot span:last-child{font-family:var(--f-mono)}
.free{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px}
.free .bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.free .bar i{display:block;height:100%;background:var(--moss);transition:width .4s}
.eco{font-size:13.5px;color:var(--ok);font-weight:500}
.pay-opt{display:grid;gap:8px}
.demo-box{font-size:13px;background:var(--tag);color:var(--tag-ink);border-radius:10px;padding:10px 12px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:999px;font-weight:600;z-index:100;transition:transform .3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* logo Up'Appart */
.logo svg{width:32px;height:40px;flex:none}
.logo .wm{display:inline-flex;align-items:flex-start;font-family:var(--f-display);font-size:24px;line-height:1}
.logo .wm .up{color:var(--moss)}
.logo .wm svg.apos{width:.42em;height:.7em;margin:-.05em .04em 0}
/* sélecteur de langue FR / ES */
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:2px;flex:none}
.lang button{border:0;background:none;padding:5px 10px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
@media (max-width:1080px){.lang button{padding:5px 8px}}
@media (max-width:400px){.logo .wm{font-size:20px}.logo svg{width:26px;height:34px}header.site .wrap{gap:10px}}
</style>

function renderResults(){
  const f=S.filt;let list=P.filter(p=>(f.cat==="Tous"||p.cat===f.cat)&&(f.room==="Toutes"||p.room===f.room)&&(f.max>=300||p.price<=f.max));
  list.sort((a,b)=>f.sort==="asc"?a.price-b.price:f.sort==="desc"?b.price-a.price:b.added.localeCompare(a.added));
  list.sort((a,b)=>isSold(a.id)-isSold(b.id));
  const el=document.getElementById("results");if(!el)return;
  el.innerHTML=list.length?list.map(card).join(""):`<div class="empty">${t("empty")}</div>`;
  document.getElementById("count").textContent=t("count",list.length);
}

function mapSvg(){
  const places=[["Écusson",300,170],["Antigone",360,190],["Port Marianne",410,250],["Beaux-Arts",310,120],["Castelnau-le-Lez",420,95],["Lattes",360,320],["Juvignac",130,150],["Saint-Jean-de-Védas",160,290],["Pérols",500,330],["Grabels",170,60]];
  return `<svg viewBox="0 0 600 380" role="img" aria-label="${t("mapAria")}"><rect width="600" height="380" style="fill:var(--surface)"/>
  <circle cx="310" cy="190" r="230" style="fill:var(--t-meubles)" opacity=".9"/>
  <path d="M440 0 Q400 80 380 150 T360 260 Q350 320 330 380" fill="none" stroke="#7FA6B8" stroke-width="6" stroke-linecap="round"/>
  <text x="392" y="232" style="fill:#5D8799" font-size="13" font-style="italic">Le Lez</text>
  <path d="M60 170 Q200 180 300 170 T560 200" fill="none" style="stroke:var(--line)" stroke-width="5"/>
  ${places.map(([n,x,y])=>`<circle cx="${x}" cy="${y}" r="4" style="fill:var(--muted)"/><text x="${x+8}" y="${y+4}" font-size="13" style="fill:var(--ink)" font-family="Figtree,sans-serif">${n}</text>`).join("")}
  <g transform="translate(300 170)"><path d="M0 0c-10-14-16-22-16-30a16 16 0 0 1 32 0c0 8-6 16-16 30z" style="fill:var(--moss)" transform="translate(0 -4)"/><circle cx="0" cy="-34" r="6" style="fill:var(--on-moss)"/></g>
  <text x="20" y="360" font-size="12" style="fill:var(--muted)" font-family="IBM Plex Mono,monospace">${t("mapNote")}</text></svg>`;
}

/* ---------- utilitaires ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
let tT;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>el.classList.remove("show"),2400)}
const mailOk=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);

/* ---------- langue ---------- */
function applyStatic(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>el.setAttribute("aria-label",t(el.dataset.i18nAria)));
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));
  document.getElementById("newsMsg").textContent="";
  drawInsta();
}
function setLang(l){if(l===LANG)return;LANG=l;store.set("lang",l);applyStatic();const y=window.scrollY;route(true);window.scrollTo(0,y);if(drawer.classList.contains("open")){if(S.step===1)readCo();renderCart()}}

/* ---------- routeur ---------- */
const app=document.getElementById("app");
function route(keepScroll){
  const h=(location.hash||"#accueil").slice(1);
  let r=h,arg=null;
  if(h.startsWith("produit-")){r="produit";arg=h.slice(8)}
  if(!V[r])r="accueil";
  app.innerHTML=V[r](arg);
  document.querySelectorAll("nav.main a").forEach(a=>{if(a.dataset.r===r||(r==="produit"&&a.dataset.r==="boutique"))a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  document.getElementById("mainNav").classList.remove("open");document.getElementById("menuBtn").setAttribute("aria-expanded","false");
  if(keepScroll!==true)window.scrollTo(0,0);
  if(r==="boutique"){document.getElementById("sort").value=S.filt.sort;renderResults()}
}
window.addEventListener("hashchange",()=>route());

/* ---------- panier ---------- */
const drawer=document.getElementById("drawer"),overlay=document.getElementById("overlay");
function updCount(){document.getElementById("cartCount").textContent=S.cart.length}
function totals(){const sub=S.cart.reduce((a,id)=>a+byId(id).price,0);const fee=(S.co.mode==="retrait"||sub>=FREE||!sub)?0:FEE;return{sub,fee,tot:sub+fee,kg:S.cart.reduce((a,id)=>a+byId(id).kg,0)}}
function openCart(step){S.step=step||0;drawer.classList.add("open");overlay.classList.add("open");drawer.setAttribute("aria-hidden","false");renderCart();setTimeout(()=>document.getElementById("drClose").focus(),50)}
function closeCart(){drawer.classList.remove("open");overlay.classList.remove("open");drawer.setAttribute("aria-hidden","true");if(S.step===3)S.step=0}
function addToCart(id,open){id=+id;if(isSold(id))return;if(!inCart(id)){S.cart.push(id);save();toast(t("added"));}updCount();refreshButtons();if(open)openCart(0)}
function refreshButtons(){document.querySelectorAll("[data-add]").forEach(b=>{const inc=inCart(+b.dataset.add);if(b.classList.contains("btn-add")){b.classList.toggle("in",inc);b.textContent=inc?t("inCart"):t("add")}else{b.textContent=inc?t("viewCart"):t("addToCart")}})}
function lineHtml(id){const p=byId(id),c=catOf(p.cat);return `<div class="line"><div class="mini" style="--tint:${c.tint}">${art(p.kind,p.color)}</div><div><b>${L(p,"name")}</b><small>${stateL(p.state)}${p.cat==="Électroménager"?t("guar3"):""}</small>${S.step===0?`<br><button data-rm="${id}">${t("remove")}</button>`:""}</div><span class="pr">${eur(p.price)}</span></div>`}
function totHtml(){const x=totals();return `<div class="tot"><span>${t("subtotal")}</span><span>${eur(x.sub)}</span></div><div class="tot"><span>${S.co.mode==="retrait"?t("pickup"):t("delivery")}</span><span>${x.fee?eur(x.fee):t("offered")}</span></div><div class="tot big"><span>${t("total")}</span><span>${eur(x.tot)}</span></div>`}
function renderCart(){
  const body=document.getElementById("drBody"),foot=document.getElementById("drFoot"),x=totals();
  document.getElementById("drSteps").innerHTML=[0,1,2,3].map(i=>`<span class="${i<=S.step?"on":""}"></span>`).join("");
  document.getElementById("drTitle").textContent=t("drTitles")[S.step];
  if(S.step===0){
    if(!S.cart.length){body.innerHTML=`<div class="empty" style="margin-top:10px">${t("cartEmpty")}</div>`;foot.innerHTML=`<a class="btn btn-primary" href="#boutique" id="goShop">${t("seeShop")}</a>`;return}
    const left=Math.max(0,FREE-x.sub);
    body.innerHTML=`<div class="free">${left?t("freeLeft",eur(left)):t("freeOk")}<div class="bar"><i style="width:${Math.min(100,x.sub/FREE*100)}%"></i></div></div>${S.cart.map(lineHtml).join("")}<p class="eco" style="margin-top:14px">${t("eco",kgf(x.kg))}</p>`;
    foot.innerHTML=totHtml()+`<button class="btn btn-primary" data-step="1">${t("checkout")}</button>`;
  }else if(S.step===1){
    const c=S.co;
    body.innerHTML=`<form class="form" id="coForm" novalidate>
     <div class="field"><span class="lab">${t("mode")}</span><div class="radios"><label><input type="radio" name="mode" id="m-liv" value="livraison" ${c.mode==="livraison"?"checked":""}>${t("modeDel")}</label><label><input type="radio" name="mode" id="m-ret" value="retrait" ${c.mode==="retrait"?"checked":""}>${t("modePick")}</label></div></div>
     <div class="row2"><div class="field"><label for="co-name">${t("coName")}</label><input id="co-name" value="${esc(c.name||"")}" autocomplete="name"></div><div class="field"><label for="co-tel">${t("fTel")}</label><input id="co-tel" type="tel" value="${esc(c.tel||"")}" autocomplete="tel"></div></div>
     <div class="field"><label for="co-mail">${t("fMail")}</label><input id="co-mail" type="email" value="${esc(c.mail||"")}" autocomplete="email"></div>
     <div id="addrBlock" ${c.mode==="retrait"?"hidden":""}>
      <div class="field"><label for="co-addr">${t("coAddr")}</label><input id="co-addr" value="${esc(c.addr||"")}" autocomplete="street-address" placeholder="${t("coAddrPh")}"></div>
      <div class="field" style="margin-top:14px"><label for="co-zip">${t("fZip")}</label><input id="co-zip" inputmode="numeric" maxlength="5" value="${esc(c.zip||"")}" autocomplete="postal-code"><p class="zone-res" id="coZip"></p></div>
      <div class="field" style="margin-top:6px"><label for="co-slot">${t("coSlot")}</label><select id="co-slot">${t("slots").map(s=>`<option>${s}</option>`).join("")}</select></div></div>
     <div id="retBlock" class="demo-box" ${c.mode==="retrait"?"":"hidden"}>${t("pickInfo")}</div>
     <p class="err" id="coErr" role="alert"></p></form>`;
    foot.innerHTML=totHtml()+`<div style="display:flex;gap:8px"><button class="btn btn-ghost" data-step="0">${t("back")}</button><button class="btn btn-primary" style="flex:1" id="toPay">${t("toPay")}</button></div>`;
    if(c.zip)checkZip(c.zip,document.getElementById("coZip"));
  }else if(S.step===2){
    body.innerHTML=`${S.cart.map(lineHtml).join("")}<div class="panel" style="margin-top:16px;padding:16px"><b>${S.co.mode==="retrait"?t("pickup"):t("delTo")+esc(S.co.addr||"")+", "+esc(S.co.zip||"")}</b><br><small style="color:var(--muted)">${esc(S.co.name||"")} · ${esc(S.co.tel||"")}</small></div>
     <div class="field" style="margin-top:16px"><span class="lab">${t("payMethod")}</span><div class="radios pay-opt"><label><input type="radio" name="pay" id="pay-cb" checked>${t("payCard")}</label><label><input type="radio" name="pay" id="pay-pp">${t("payPP")}</label><label><input type="radio" name="pay" id="pay-3x">${t("pay3")}</label></div></div>
     <p class="demo-box" style="margin-top:14px">${t("payDemo")}</p>`;
    foot.innerHTML=totHtml()+`<div style="display:flex;gap:8px"><button class="btn btn-ghost" data-step="1">${t("back")}</button><button class="btn btn-primary" style="flex:1" id="payBtn">${t("pay",eur(x.tot))}</button></div>`;
  }else{
    body.innerHTML=`<div class="success">${ICON.check}<h3>${t("confT")}</h3><p>${t("confNum")} <b style="font-family:var(--f-mono)">${S.co.num}</b>. ${S.co.mode==="retrait"?t("confPick"):t("confDel")}</p><p class="eco" style="margin-top:14px">${t("confEco",kgf(S.co.kg))}</p></div>`;
    foot.innerHTML=`<button class="btn btn-primary" id="doneBtn">${t("keepShopping")}</button>`;
  }
}
function checkZip(v,el){v=(v||"").trim();el.className="zone-res";if(!/^\d{5}$/.test(v)){el.textContent=v?t("zoneBadFmt"):"";return false}
  if(ZIPS[v]){el.classList.add("ok");el.textContent=t("zoneOk",ZIPS[v],eur(FREE));return true}
  el.classList.add("no");el.textContent=t("zoneNo");return false}
function readCo(){const g=id=>{const e=document.getElementById(id);return e?e.value.trim():""};Object.assign(S.co,{name:g("co-name"),tel:g("co-tel"),mail:g("co-mail"),addr:g("co-addr"),zip:g("co-zip")})}

/* ---------- événements ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-lang],[data-add],[data-rm],[data-step],[data-go],[data-cat],[data-sort],[data-f],[data-view],[data-jump],#toPay,#payBtn,#doneBtn,#goShop,#resetF,#fToggle,#zipBtn");
  if(!el)return;
  if(el.dataset.lang){setLang(el.dataset.lang);return}
  if(el.dataset.add){e.preventDefault();if(inCart(+el.dataset.add)&&el.dataset.open){openCart(0);return}addToCart(el.dataset.add,!!el.dataset.open);return}
  if(el.dataset.rm){S.cart=S.cart.filter(x=>x!==+el.dataset.rm);save();updCount();renderCart();refreshButtons();return}
  if(el.dataset.step){if(S.step===1)readCo();S.step=+el.dataset.step;renderCart();return}
  if(el.dataset.go){location.hash=el.dataset.go;return}
  if(el.dataset.cat){S.filt={cat:el.dataset.cat,room:"Toutes",max:300,sort:"recent"};return}
  if(el.dataset.sort){S.filt.sort=el.dataset.sort;return}
  if(el.dataset.f){S.filt[el.dataset.f]=el.dataset.v;document.querySelectorAll(`[data-f="${el.dataset.f}"]`).forEach(b=>b.setAttribute("aria-pressed",b===el));renderResults();return}
  if(el.dataset.view){const v=+el.dataset.view,g=document.querySelector("#gMain svg.art");g.classList.remove("view-1","view-2");if(v)g.classList.add("view-"+v);document.querySelectorAll(".thumb").forEach(b=>b.setAttribute("aria-pressed",b===el));return}
  if(el.dataset.jump){e.preventDefault();document.getElementById("g-"+el.dataset.jump).scrollIntoView({behavior:"smooth"});return}
  if(el.id==="resetF"){S.filt={cat:"Tous",room:"Toutes",max:300,sort:S.filt.sort};route();return}
  if(el.id==="fToggle"){const f=document.getElementById("filters");f.classList.toggle("open");el.setAttribute("aria-expanded",f.classList.contains("open"));return}
  if(el.id==="zipBtn"){checkZip(document.getElementById("zip").value,document.getElementById("zipRes"));return}
  if(el.id==="goShop"){closeCart();return}
  if(el.id==="toPay"){readCo();const err=document.getElementById("coErr");const c=S.co;
    if(!c.name||!c.tel||!mailOk(c.mail)){err.textContent=t("eCo1");return}
    if(c.mode==="livraison"){if(!c.addr){err.textContent=t("eCo2");return}if(!checkZip(c.zip,document.getElementById("coZip"))){err.textContent=t("eCo3");return}}
    S.step=2;renderCart();return}
  if(el.id==="payBtn"){el.disabled=true;el.textContent=t("paying");setTimeout(()=>{S.co.num="UA-"+Math.floor(10000+Math.random()*89999);S.co.kg=totals().kg;S.sold=[...new Set([...S.sold,...S.cart])];S.cart=[];save();updCount();S.step=3;renderCart();route(true)},1100);return}
  if(el.id==="doneBtn"){closeCart();location.hash="#boutique";return}
});
document.addEventListener("change",e=>{
  if(e.target.name==="mode"){readCo();S.co.mode=e.target.value;renderCart()}
  if(e.target.id==="sort"){S.filt.sort=e.target.value;renderResults()}
  if(e.target.id==="s-photos")addPhotos(e.target.files);
});
document.addEventListener("input",e=>{
  if(e.target.id==="maxPrice"){S.filt.max=+e.target.value;document.getElementById("maxVal").textContent=priceLabel();renderResults()}
  if(e.target.id==="co-zip"&&e.target.value.length===5)checkZip(e.target.value,document.getElementById("coZip"));
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&drawer.classList.contains("open"))closeCart();if(e.key==="Enter"&&e.target.id==="zip")checkZip(e.target.value,document.getElementById("zipRes"))});
document.getElementById("cartBtn").onclick=()=>openCart(0);
document.getElementById("drClose").onclick=closeCart;overlay.onclick=closeCart;
document.getElementById("menuBtn").onclick=function(){const n=document.getElementById("mainNav");n.classList.toggle("open");this.setAttribute("aria-expanded",n.classList.contains("open"))};

/* photos du formulaire de rachat */
let photos=[];
function addPhotos(files){[...files].filter(f=>f.type.startsWith("image/")).slice(0,6-photos.length).forEach(f=>{const r=new FileReader();r.onload=()=>{photos.push(r.result);drawPhotos()};r.readAsDataURL(f)})}
function drawPhotos(){const el=document.getElementById("previews");if(!el)return;el.innerHTML=photos.map((src,i)=>`<figure><img src="${src}" alt="${t("photo")} ${i+1}"><button type="button" data-ph="${i}" aria-label="${t("rmPhoto")} ${i+1}">×</button></figure>`).join("")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-ph]");if(b){photos.splice(+b.dataset.ph,1);drawPhotos()}});
["dragover","dragenter"].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}}));
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.remove("over");addPhotos(e.dataTransfer.files)}});

/* formulaires */
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target,v=id=>(document.getElementById(id)||{}).value?.trim()||"";
  if(f.id==="newsForm"){const m=v("newsMail"),o=document.getElementById("newsMsg");o.textContent=mailOk(m)?t("newsOk"):t("newsBad");if(mailOk(m))f.reset();return}
  if(f.id==="sellForm"){const err=document.getElementById("sellErr");
    if(!v("s-cat")||!v("s-name")){err.textContent=t("eSell1");return}
    if(!photos.length){err.textContent=t("eSell2");return}
    if(!v("s-first")||!/^\d{5}$/.test(v("s-zip"))||!mailOk(v("s-mail"))){err.textContent=t("eSell3");return}
    if(!document.getElementById("s-ok").checked){err.textContent=t("eSell4");return}
    const name=v("s-name"),first=v("s-first"),n=photos.length;photos=[];
    document.getElementById("sellBox").innerHTML=`<div class="success">${ICON.check}<h3>${t("sellOkT",esc(first))}</h3><p>${t("sellOkD",esc(name),n)}</p><p class="note-demo" style="margin-top:12px">${t("sellOkDemo")}</p><a class="btn btn-ghost" style="margin-top:18px" href="#boutique">${t("seeShop")}</a></div>`;return}
  if(f.id==="revForm"){const err=document.getElementById("rvErr");if(!v("rv-name")||v("rv-text").length<10){err.textContent=t("eRv");return}
    S.reviews.unshift({n:v("rv-name"),q:v("rv-q")||"Montpellier",s:+document.querySelector("[name=rv]:checked").value,t:v("rv-text")});route(true);toast(t("rvThanks"));return}
  if(f.id==="ctForm"){const err=document.getElementById("ctErr");if(!v("c-name")||!mailOk(v("c-mail"))||!v("c-msg")){err.textContent=t("eCt");return}
    document.getElementById("ctBox").innerHTML=`<div class="success">${ICON.check}<h3>${t("ctOkT")}</h3><p>${t("ctOkD")}</p><p class="note-demo" style="margin-top:12px">${t("ctOkDemo")}</p></div>`;return}
});

/* instagram */
function drawInsta(){document.getElementById("insta").innerHTML=[1,16,15,2,13,9].map(byId).map(p=>`<a href="#produit-${p.id}" style="--tint:${catOf(p.cat).tint}" aria-label="${L(p,"name")}">${art(p.kind,p.color)}</a>`).join("")}

applyStatic();updCount();route();
})();
</script>

</body>
</html>
